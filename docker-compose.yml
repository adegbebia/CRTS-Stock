services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crts-stock
    ports:
      - "8000:8000"
    volumes:
      # Persiste la base sqlite et les fichiers uploades entre deux
      # "docker compose down/up", sans quoi tout serait reinitialise
      # a chaque reconstruction de l'image.
      - crts_database:/var/www/html/database
      - crts_storage:/var/www/html/storage/app
    # Pas de "network_mode" special: le conteneur n'a besoin d'aucun
    # acces sortant une fois demarre, tout est deja embarque dedans.

volumes:
  crts_database:
  crts_storage:
